<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>QR Mesas - Sushi House</title>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 30px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .mesas {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            max-width: 800px;
            margin: auto;
        }

        .mesa {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .mesa h2 {
            margin-top: 0;
        }

        .qr {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .mesa p {
            margin-bottom: 0;
            color: #555;
        }

        @media print {
            body {
                background: white;
                margin: 0;
            }

            .mesa {
                box-shadow: none;
                border: 1px solid #ddd;
                break-inside: avoid;
            }
        }
    </style>
</head>

<body>

    <h1>Sushi House - QR de las mesas</h1>

    <div class="mesas" id="mesas"></div>

    <script>

        const numeroDeMesas = 10;

        const urlBase = "https://sushi-house-production.up.railway.app/";

        const contenedor = document.getElementById("mesas");

        for (let mesa = 1; mesa <= numeroDeMesas; mesa++) {

            const tarjeta = document.createElement("div");
            tarjeta.className = "mesa";

            tarjeta.innerHTML = `
                <h2>MESA ${mesa}</h2>
                <div class="qr" id="qr-${mesa}"></div>
                <p>Escanea para realizar tu pedido</p>
            `;

            contenedor.appendChild(tarjeta);

            new QRCode(document.getElementById("qr-" + mesa), {
                text: urlBase + "?mesa=" + mesa,
                width: 200,
                height: 200
            });
        }

    </script>

</body>

</html>
